<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#091b1c">
  <title>Connection needed | Virtus AI</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#071415,#09362d);font-family:Arial,sans-serif;color:#f4f0e7}
    main{width:min(100%,460px);border:1px solid #9f8049;border-radius:22px;padding:38px 28px;text-align:center;background:#08231f;box-shadow:0 20px 55px #0005}
    img{width:76px;height:86px;object-fit:contain}
    h1{font:normal 32px Georgia,serif;color:#f1d390;margin:24px 0 12px}
    p{color:#c6d6cc;line-height:1.65}
    button{cursor:pointer;border:0;background:#e9c782;color:#09261f;padding:13px 24px;border-radius:10px;font-weight:700;margin-top:18px}
  </style>
</head>
<body>
  <main>
    <img src="/virtus-aurum-emblem.svg" alt="Virtus AI">
    <h1>Connection needed</h1>
    <p>Virtus AI works online so that your coaching conversations and account remain up to date. Reconnect to the internet, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
