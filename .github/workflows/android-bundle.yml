name: Virtus AI Android Bundle

on:
  push:
    branches:
      - fix/android-native-interface-20261031
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - '.github/workflows/android-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use runner Android SDK
        run: echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Synchronize Capacitor Android project
        run: npx cap sync android
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build Android App Bundle (unsigned validation build)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease --no-daemon
      - name: Upload unsigned bundle for build verification
        uses: actions/upload-artifact@v4
        with:
          name: virtus-ai-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
