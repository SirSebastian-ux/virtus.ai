name: Virtus AI Signed Android Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and synchronize Android
        run: |
          npm ci
          npx cap sync android
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Validate signing secrets and restore keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEYSTORE_BASE64"
          test -n "$UPLOAD_KEYSTORE_PASSWORD"
          test -n "$UPLOAD_KEY_PASSWORD"
          test -n "$UPLOAD_KEY_ALIAS"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/virtus-upload.jks"
          test -s "$RUNNER_TEMP/virtus-upload.jks"
      - name: Build signed release bundle
        working-directory: android
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease --no-daemon \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/virtus-upload.jks" \
            "-Pandroid.injected.signing.store.password=$UPLOAD_KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$UPLOAD_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$UPLOAD_KEY_PASSWORD"
      - name: Verify bundle signature
        run: |
          set -euo pipefail
          BUNDLE="$(find android/app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)"
          test -n "$BUNDLE"
          jarsigner -verify "$BUNDLE"
      - name: Upload signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: virtus-ai-signed-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
      - name: Delete temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/virtus-upload.jks"
