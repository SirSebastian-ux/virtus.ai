name: Create draft Google Play subscriptions

# Runs when this workflow first lands on main, then on demand.
# Idempotent: existing product IDs are read and never overwritten.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/create-google-play-subscriptions.yml

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: google-play-draft-subscription-catalog
  cancel-in-progress: false

jobs:
  catalog:
    name: Create missing draft Virtus AI subscription products
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Play without stored keys
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: melodic-nature-513606-u2
          workload_identity_provider: projects/481064087365/locations/global/workloadIdentityPools/-virtus-play-github/providers/-github-actions
          service_account: virtus-play-api@melodic-nature-513606-u2.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false

      - name: Create missing monthly draft subscriptions, then verify
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ANDROID_PACKAGE: com.virtusaiworld.app
        run: node scripts/google-play/create-draft-subscriptions.mjs

      # Share the outcome as a commit status, which the connected GitHub tool can read.
      - name: Publish catalog operation status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_RESULT" in
            success)
              state=success
              description="Google Play draft catalog step finished; inspect run for product results"
              ;;
            cancelled)
              state=error
              description="Google Play draft catalog run was cancelled"
              ;;
            *)
              state=failure
              description="Google Play draft catalog step failed; inspect run error"
              ;;
          esac
          body="$(jq -nc \
            --arg state "$state" \
            --arg context 'Google Play draft catalog' \
            --arg description "$description" \
            --arg target_url "https://github.com/${REPO}/actions/runs/${RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$body" \
            "https://api.github.com/repos/${REPO}/statuses/${SHA}" >/dev/null
          echo "Published Google Play catalog status: ${state}"
