name: Verify Google Play Developer API

# Read-only connectivity check. Runs once when this workflow reaches main,
# then only when manually requested from GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-google-play-api.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-play-api-connectivity
  cancel-in-progress: false

jobs:
  verify:
    name: Check authorized Google Play subscription catalog access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate without a service-account key
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: melodic-nature-513606-u2
          workload_identity_provider: projects/481064087365/locations/global/workloadIdentityPools/-virtus-play-github/providers/-github-actions
          service_account: virtus-play-api@melodic-nature-513606-u2.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify read-only access to Virtus AI subscriptions
        shell: bash
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ANDROID_PACKAGE: com.virtusaiworld.app
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/google-play-api-response.json"
          status="$(curl --silent --show-error --location \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GOOGLE_ACCESS_TOKEN}" \
            --header 'Accept: application/json' \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${ANDROID_PACKAGE}/subscriptions?pageSize=1")"

          case "$status" in
            200)
              # The subscription list endpoint returns a JSON object when it has a body.
              if ! jq -e 'type == "object" and ((.subscriptions // []) | type == "array")' "$response_file" >/dev/null; then
                echo "::error::Google Play returned HTTP 200 but not a valid subscriptions list response."
                exit 1
              fi
              count="$(jq -r '(.subscriptions // []) | length' "$response_file")"
              echo "Google Play API authentication and read-only subscription-list access verified."
              echo "Products returned on first page: ${count}"
              ;;
            204)
              # A 204 is successful, but its empty body cannot enumerate subscriptions.
              echo "Google Play API responded HTTP 204 (No Content). Authentication and the read-only request succeeded."
              echo "No subscription catalog data was returned; no product count is asserted."
              ;;
            *)
              message="$(jq -r '.error.message // empty' "$response_file" 2>/dev/null || true)"
              if [ -z "$message" ]; then message="No structured error detail in response"; fi
              echo "::error::Google Play read-only API check failed (HTTP ${status}): ${message}"
              exit 1
              ;;
          esac
